<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-orientation" content="portrait" />
    <meta name="x5-page-mode" content="app" />
    <title>test-file-selector</title>
  </head>
  <body>
    <button @click="selectSinglePicture" id="selectSinglePicture">选择单个图片</button>
    <button @click="selectMultiPicture" id="selectMultiPicture">选择多个图片</button>
    <script src="../dist/index.full.umd.js"></script>
    <script>
      let btn1 = document.getElementById("selectSinglePicture");
      btn1.onclick = function () {
        let fileSelector = new FileSelector({ accept: "image/gif,image/jpeg,image/jpg,image/png", maxSize: 2 });
        fileSelector
          .on("oversize-error", (error,file) => {
            console.log(error.message || "文件大小超出了",file);
          })
          .on("file-type-error", (error,file) => {
            console.log(error.message || "文件类型有误",file);
          })
          .once("select-file-success", (file) => {
            fileSelector.getFileInArrayBuffer().then((data) => {
              console.log(data[0]);
            });
          })
          .selectFile();
      };
      let btn2 = document.getElementById("selectMultiPicture");
      btn2.onclick = function () {
        let fileSelector = new FileSelector({ accept: "image/gif,image/jpeg,image/jpg,image/png", maxSize: 2, multiple: true });
        fileSelector
          .on("oversize-error", (error) => {
            console.log(error.message || "文件大小超出了");
          })
          .on("file-type-error", (error) => {
            console.log(error.message || "文件类型有误");
          })
          .once("select-file-success", (file) => {
            fileSelector.getFileInArrayBuffer().then((data) => {
              console.log(data[0]);
            });
          })
          .selectFile();
      };
    </script>
  </body>
</html>
